<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Hours - Discover Best Deals</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo-container">
                <img src="feature-icon.png" alt="Happy Hours App Icon">
                <span class="logo-text">Happy Hours</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="container hero">
            <div class="hero-content">
                <h1>Unlock the Best<br>Happy Hour Deals</h1>
                <p>Find exclusive drinks & food specials near you. The ultimate guide to your city's happy hours, right
                    in
                    your pocket.</p>

                <div class="store-buttons">
                    <a href="https://apps.apple.com/us/app/happy-hours-global/id6752629523" class="store-btn">
                        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
                            alt="Download on the App Store">
                    </a>
                    <a href="https://play.google.com/store/apps/details?id=com.happyhoursglobal" class="store-btn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                            alt="Get it on Google Play">
                    </a>
                </div>
            </div>

            <div class="hero-visual">
                <!-- Using the video gif as the main visual attractor -->
                <img src="happyhour-video.gif" alt="Happy Hours App Demo">
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="gallery">
            <div class="container">
                <h2>App Screenshots</h2>
                <div class="gallery-grid">
                    <img src="home.png" alt="Happy Hours Home" class="screenshot">
                    <img src="home1.png" alt="Map View" class="screenshot">
                    <img src="home2.png" alt="List View" class="screenshot">
                    <img src="home3.png" alt="Deal Details" class="screenshot">
                    <img src="home4.png" alt="Search" class="screenshot">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Happy Hours Global. All rights reserved.</p>
            <p>Questions? Contact us at <a href="mailto:android.sjsu@gmail.com">android.sjsu@gmail.com</a></p>
            <p><a href="happyhourPrivacyPolicy.html">Privacy Policy</a></p>
        </div>
    </footer>

</body>

</html>
